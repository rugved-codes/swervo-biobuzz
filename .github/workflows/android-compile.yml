name: FTC Android compile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out robot code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize Gradle wrapper line endings
        run: sed -i 's/\r$//' gradlew

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile FTC TeamCode
        run: ./gradlew :TeamCode:compileDebugJavaWithJavac --no-daemon
